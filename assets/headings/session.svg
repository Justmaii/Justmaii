<text x="24" y="136" font-size="15"><tspan fill="#c9d1d9">Student. I write chess engines from scratch,</tspan></text>
<text x="24" y="160" font-size="15"><tspan fill="#c9d1d9">then rewrite them in a faster language.</tspan></text>
<text x="24" y="184" font-size="15"><tspan fill="#8b949e">Three versions so far: C#, C#, C++.</tspan></text>
<text x="24" y="208" font-size="15"><tspan fill="#3fb950">mai</tspan><tspan fill="#3fb950">@mbp </tspan><tspan fill="#58a6ff">~ </tspan><tspan fill="#c9d1d9">$ </tspan><tspan fill="#c9d1d9">echo uci | ./maiengine</tspan></text>
<text x="24" y="232" font-size="15"><tspan fill="#c9d1d9">id name MaiEngine 3</tspan></text>
<text x="24" y="256" font-size="15"><tspan fill="#c9d1d9">id author Mai</tspan></text>
